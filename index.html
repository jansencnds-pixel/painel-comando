<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0B1D26; --panel:#142B38; --border:#24404F;
    --text:#E8E1D3; --muted:#8FA3AD; --dim:#6E8590; --brass:#C9A05C;
    --green:#4A9B6E; --amber:#D4A03C; --red:#C24B3F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior-y:none; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  input,select,button,textarea{ font-family:'Inter',sans-serif; }
  ::selection{ background:var(--brass); color:var(--bg); }

  #app{ display:flex; flex-direction:column; height:100dvh; }

  #splash{
    position:fixed; inset:0; z-index:50;
    background-size:cover; background-position:center 25%;
    display:flex; flex-direction:column; justify-content:flex-end;
    cursor:pointer;
  }
  #splash::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(11,29,38,0.35) 0%, rgba(11,29,38,0.25) 35%, rgba(11,29,38,0.92) 88%, var(--bg) 100%);
  }
  #splash .splashcontent{
    position:relative; padding:0 28px calc(env(safe-area-inset-bottom) + 56px);
    text-align:center;
  }
  #splash .anchor{ margin-bottom:14px; opacity:0.9; }
  #splash .shipname{
    font-family:'Fraunces',serif; font-weight:600; font-size:34px; color:#fff;
    letter-spacing:.02em; text-shadow:0 2px 10px rgba(0,0,0,0.5); margin:0;
  }
  #splash .shiptag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(255,255,255,0.8);
    letter-spacing:.14em; text-transform:uppercase; margin-top:6px;
  }
  #splash .enterhint{
    font-family:'Inter',sans-serif; font-size:12px; color:rgba(255,255,255,0.55);
    margin-top:36px; letter-spacing:.03em;
  }
  #splash.hide{ animation: fadeout .35s ease forwards; pointer-events:none; }
  @keyframes fadeout{ to{ opacity:0; } }

  #login{
    position:fixed; inset:0; z-index:60; background:var(--bg);
    align-items:center; justify-content:center; padding:24px;
  }
  .loginform{ width:100%; max-width:320px; text-align:center; }
  .loginform .anchor{ display:flex; justify-content:center; margin-bottom:10px; }
  .loginTitle{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; color:var(--text); margin:0; }
  .loginSub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); margin-top:4px; }
  .loginError{ color:var(--red); font-size:12px; margin-top:10px; font-family:'IBM Plex Mono',monospace; }

  header{
    flex-shrink:0; border-bottom:1px solid var(--border);
    padding:14px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:20px;
    margin:0; letter-spacing:.02em; display:flex; align-items:center; gap:8px;
  }
  header .badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--red);
    display:flex; align-items:center; gap:5px;
  }
  header .dot{ width:6px; height:6px; border-radius:50%; background:var(--red); }

  main{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 88px);
  }
  .maxw{ max-width:640px; margin:0 auto; }

  .empty{ color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:16px 0; }

  .row{
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-bottom:1px solid #1E3644;
  }
  .row:last-of-type{ border-bottom:none; }
  .row .title{ font-size:14px; color:var(--text); flex:1; min-width:0; white-space:normal; line-height:1.4; }
  .row .sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); margin-top:2px; }
  .row .status{ font-family:'IBM Plex Mono',monospace; font-size:11px; flex-shrink:0; }
  .dotstatus{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .iconbtn{ background:none; border:none; padding:6px; flex-shrink:0; cursor:pointer; opacity:.7; }
  .iconbtn:active{ transform:scale(0.9); opacity:1; }

  .editform{ padding:12px 0; display:flex; flex-direction:column; gap:8px; }
  .editform .fldrow{ display:flex; flex-wrap:wrap; gap:8px; }
  .editactions{ display:flex; gap:8px; justify-content:flex-end; }
  .savebtn{ background:var(--green); color:var(--bg); border:none; border-radius:6px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .cancelbtn{ background:transparent; color:var(--dim); border:1px solid var(--border); border-radius:6px; padding:8px 12px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .iconbtn:active{ transform:scale(0.9); opacity:1; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .cardhead{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .cardhead h2{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0; }
  .cardhead .count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); }

  form.addform{ display:flex; flex-wrap:wrap; gap:8px; padding-top:12px; }
  .fld{
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:10px 12px; font-size:14px; flex:1; min-width:120px;
  }
  .fld:focus{ outline:none; border-color:var(--brass); }
  .addbtn{
    background:var(--brass); color:var(--bg); border:none; border-radius:6px;
    padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:4px; flex-shrink:0;
  }
  .addbtn:active{ transform:scale(0.96); }

  .voicebtn{
    width:100%; background:linear-gradient(135deg, var(--brass), #B8934E); color:var(--bg);
    border:none; border-radius:10px; padding:14px; margin-bottom:14px;
    font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  .voicebtn:active{ transform:scale(0.98); }

  .task .row .title.done{ color:#5A6E77; text-decoration:line-through; }
  .prio{ font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; flex-shrink:0; }

  .alertrow{ background:rgba(194,75,63,0.08); border-radius:6px; margin:0 -8px; padding:12px 8px; }

  nav.tabbar{
    flex-shrink:0; display:flex; border-top:1px solid var(--border);
    background:var(--panel); padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:10px 4px 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--dim); font-family:'Inter',sans-serif; font-size:10px;
  }
  nav.tabbar button.active{ color:var(--brass); }
  nav.tabbar button:active{ opacity:.7; }
  nav.tabbar svg{ width:22px; height:22px; }

  .datebtn{ color:var(--dim); background:transparent; border:none; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:right; }
</style>
</head>
<body>
<div id="splash" onclick="enterApp()"></div>
<div id="login" style="display:none"></div>
<div id="app"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB5z71rr25NrlUlnVNA-7fNTRGTgOpVbWA",
  authDomain: "painel-comando.firebaseapp.com",
  projectId: "painel-comando",
  storageBucket: "painel-comando.firebasestorage.app",
  messagingSenderId: "875373390236",
  appId: "1:875373390236:web:d8bf7a86663fe598bbc059"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
let unsubscribeSnapshot = null;

function docRef(uid){ return doc(db, 'users', uid, 'painel', 'state'); }

function renderLogin(errorMsg){
  document.getElementById('splash').style.display = 'none';
  document.getElementById('app').innerHTML = '';
  const loginEl = document.getElementById('login');
  loginEl.style.display = 'flex';
  loginEl.innerHTML = `
    <form class="loginform" onsubmit="return false;">
      <div class="anchor">${window.icon ? window.icon('anchor','#C9A05C',28) : ''}</div>
      <p class="loginTitle">Painel de Comando</p>
      <p class="loginSub">Entre com sua conta</p>
      <input class="fld" id="login-email" type="email" placeholder="E-mail" autocomplete="username" style="width:100%;margin-top:18px">
      <input class="fld" id="login-pass" type="password" placeholder="Senha" autocomplete="current-password" style="width:100%;margin-top:10px">
      ${errorMsg ? `<p class="loginError">${errorMsg}</p>` : ''}
      <button class="addbtn" id="login-submit" style="width:100%;justify-content:center;margin-top:14px">Entrar</button>
    </form>
  `;
  document.getElementById('login-submit').onclick = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!email || !pass) return;
    try{
      await signInWithEmailAndPassword(auth, email, pass);
    }catch(e){
      renderLogin('E-mail ou senha incorretos.');
    }
  };
}

onAuthStateChanged(auth, (user) => {
  if (unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  if (!user){
    renderLogin();
    return;
  }
  document.getElementById('login').style.display = 'none';
  window.__uid = user.uid;
  window.__bootApp();
  unsubscribeSnapshot = onSnapshot(docRef(user.uid), (snap) => {
    if (snap.exists()){
      window.__applyRemoteData(snap.data());
    } else {
      window.__initRemoteData();
    }
  }, (err) => {
    console.error('sync error', err);
  });
});

window.__firestoreSave = async (data) => {
  if (!window.__uid) return;
  try{ await setDoc(docRef(window.__uid), data); }
  catch(e){ console.error('firestore save failed', e); }
};
window.__firestoreInitIfEmpty = async (seedData) => {
  if (!window.__uid) return;
  const ref = docRef(window.__uid);
  const snap = await getDoc(ref);
  if (!snap.exists()){ await setDoc(ref, seedData); }
};
</script>

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0,10);

function daysUntil(dateStr){
  const t = new Date(todayISO());
  const target = new Date(dateStr);
  return Math.round((target - t) / 86400000);
}
function certStatus(dateStr){
  const d = daysUntil(dateStr);
  if (d < 0) return { label:`Vencido há ${Math.abs(d)}d`, color:'var(--red)' };
  if (d <= 30) return { label:`${d}d restantes`, color:'var(--amber)' };
  return { label:`${d}d restantes`, color:'var(--green)' };
}
function minutesUntil(iso){ return Math.round((new Date(iso) - new Date()) / 60000); }
function reminderStatus(iso){
  const m = minutesUntil(iso);
  if (m < 0) return { key:'overdue', label:'Atrasado', color:'var(--red)' };
  if (m <= 60) return { key:'soon', label: m<=1 ? 'Agora' : `Em ${m}min`, color:'var(--amber)' };
  if (m <= 1440) return { key:'today', label:`Em ${Math.round(m/60)}h`, color:'var(--amber)' };
  return { key:'later', label:`Em ${Math.round(m/1440)}d`, color:'var(--green)' };
}
function fmtDateTime(iso){
  return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let state = { tab:'reminders', data:null, editing:null };

async function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){}
  if (window.__firestoreSave){ await window.__firestoreSave(state.data); }
}

window.__applyRemoteData = (data) => {
  state.data = {
    certs: Array.isArray(data.certs) ? data.certs : [],
    tasks: Array.isArray(data.tasks) ? data.tasks : [],
    logs: Array.isArray(data.logs) ? data.logs : [],
    reminders: Array.isArray(data.reminders) ? data.reminders : [],
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){}
  render();
};

window.__initRemoteData = () => {
  state.data = { certs: seedCerts, tasks: seedTasks, logs: [], reminders: [] };

};

function setTab(tab){ state.tab = tab; state.editing = null; render(); }
window.setTab = setTab;

function alertCount(){
  return state.data.reminders.filter(r => ['overdue','soon'].includes(reminderStatus(r.when).key)).length;
}

function render(){
  const app = document.getElementById('app');
  const titles = { reminders:'Lembretes', certs:'Certificados', tasks:'Ações Pendentes', logs:'Diário de Bordo' };
  const ac = alertCount();
  app.innerHTML = `
    <header>
      <h1>${titles[state.tab]}</h1>
      <div style="display:flex;align-items:center;gap:2px">
        ${ac > 0 ? `<span class="badge" style="margin-right:8px"><span class="dot"></span>${ac} ativo${ac!==1?'s':''}</span>` : ''}
        <button class="iconbtn" onclick="exportData()" aria-label="Exportar dados">${icon('download','var(--dim)',17)}</button>
        <button class="iconbtn" onclick="document.getElementById('import-file').click()" aria-label="Importar dados">${icon('upload','var(--dim)',17)}</button>
        <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(event)">
      </div>
    </header>
    <main><div class="maxw">${renderTab()}</div></main>
    <nav class="tabbar">
      ${tabBtn('reminders','bell','Lembretes')}
      ${tabBtn('certs','alert','Certificados')}
      ${tabBtn('tasks','clipboard','Ações')}
      ${tabBtn('logs','book','Diário')}
    </nav>
  `;
  bindHandlers();
}

function tabBtn(key, iconName, label){
  const active = state.tab === key;
  return `<button class="${active?'active':''}" onclick="setTab('${key}')">
    ${icon(iconName, active ? 'var(--brass)' : 'var(--dim)', 22)}
    <span>${label}</span>
  </button>`;
}

function renderTab(){
  if (state.tab === 'reminders') return renderReminders();
  if (state.tab === 'certs') return renderCerts();
  if (state.tab === 'tasks') return renderTasks();
  return renderLogs();
}

function isSameDay(iso, ref){
  const d = new Date(iso);
  return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth() && d.getDate()===ref.getDate();
}

function buildAgendaText(){
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  const parts = [`Bom serviço, Comandante. Hoje é ${dateStr}.`];

  const remindersToday = state.data.reminders
    .filter(r => isSameDay(r.when, now))
    .sort((a,b)=> new Date(a.when)-new Date(b.when));
  const overdue = state.data.reminders.filter(r => reminderStatus(r.when).key === 'overdue');

  if (overdue.length){
    const list = overdue.map(r => r.title).join(', ');
    parts.push(`Atenção: ${overdue.length} lembrete${overdue.length!==1?'s':''} atrasado${overdue.length!==1?'s':''}: ${list}.`);
  }
  if (remindersToday.length){
    const list = remindersToday.map(r => {
      const t = new Date(r.when).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      return `${r.title} às ${t}`;
    }).join('; ');
    parts.push(`Você tem ${remindersToday.length} compromisso${remindersToday.length!==1?'s':''} hoje: ${list}.`);
  } else if (!overdue.length){
    parts.push('Nenhum lembrete marcado para hoje.');
  }

  const highTasks = state.data.tasks.filter(t => !t.done && t.priority === 'alta');
  if (highTasks.length){
    const list = highTasks.map(t => t.text).join('; ');
    parts.push(`Ações de alta prioridade pendentes: ${list}.`);
  }

  const certsAlert = state.data.certs.filter(c => daysUntil(c.expiry) <= 30);
  if (certsAlert.length){
    const list = certsAlert.map(c => {
      const d = daysUntil(c.expiry);
      return d < 0 ? `${c.name}, vencido` : `${c.name}, vence em ${d} dias`;
    }).join('; ');
    parts.push(`Atenção aos certificados: ${list}.`);
  }

  return parts.join(' ');
}

function renderReminders(){
  const list = [...state.data.reminders].sort((a,b)=> new Date(a.when)-new Date(b.when));
  const rows = list.length === 0
    ? `<p class="empty">Nenhum lembrete cadastrado.</p>`
    : list.map(r => {
        if (state.editing && state.editing.type==='reminder' && state.editing.id===r.id){
          return `<div class="editform">
            <div class="fldrow">
              <input class="fld" id="edit-rem-title" value="${esc(r.title)}" style="flex:1;min-width:160px">
              <input class="fld" id="edit-rem-when" type="datetime-local" value="${r.when}">
            </div>
            <div class="editactions">
              <button class="cancelbtn" onclick="cancelEdit()">${icon('x','var(--dim)',13)} Cancelar</button>
              <button class="savebtn" onclick="saveReminderEdit('${r.id}')">${icon('check','var(--bg)',13)} Salvar</button>
            </div>
          </div>`;
        }
        const s = reminderStatus(r.when);
        const alert = s.key==='overdue' || s.key==='soon';
        return `<div class="row ${alert?'alertrow':''}">
          ${icon(alert?'bellRing':'bell', alert?s.color:'var(--dim)')}
          <div style="flex:1;min-width:0">
            <div class="title">${esc(r.title)}</div>
            <div class="sub">${fmtDateTime(r.when)}</div>
          </div>
          <span class="status" style="color:${s.color}">${s.label}</span>
          <button class="iconbtn" onclick="startEdit('reminder','${r.id}')">${icon('edit','var(--dim)',14)}</button>
          <button class="iconbtn" onclick="deleteReminder('${r.id}')">${icon('trash','var(--red)',14)}</button>
        </div>`;
      }).join('');
  const speaking = window.speechSynthesis && window.speechSynthesis.speaking;
  return `<button class="voicebtn" onclick="toggleAgendaSpeech()">
      ${icon(speaking?'stop':'speaker', 'var(--bg)', 16)}
      <span>${speaking ? 'Parar' : 'Ouvir agenda de hoje'}</span>
    </button>
    <div class="card">
    ${rows}
    <form class="addform" onsubmit="addReminder(event)">
      <input class="fld" id="rem-title" placeholder="Reunião ou tarefa importante" style="flex:1;min-width:160px">
      <input class="fld" id="rem-when" type="datetime-local">
      <button class="addbtn" type="submit">${icon('plus','var(--bg)',14)} Adicionar</button>
    </form>
  </div>`;
}

function renderCerts(){
  const list = [...state.data.certs].sort((a,b)=> new Date(a.expiry)-new Date(b.expiry));
  const rows = list.length === 0
    ? `<p class="empty">Nenhum certificado cadastrado.</p>`
    : list.map(c => {
        if (state.editing && state.editing.type==='cert' && state.editing.id===c.id){
          return `<div class="editform">
            <div class="fldrow">
              <input class="fld" id="edit-cert-name" value="${esc(c.name)}" style="flex:1;min-width:140px">
              <input class="fld" id="edit-cert-issuer" value="${esc(c.issuer)}" style="flex:1;min-width:120px">
            </div>
            <div class="editactions">
              <button class="cancelbtn" onclick="cancelEdit()">${icon('x','var(--dim)',13)} Cancelar</button>
              <button class="savebtn" onclick="saveCertEdit('${c.id}')">${icon('check','var(--bg)',13)} Salvar</button>
            </div>
          </div>`;
        }
        const s = certStatus(c.expiry);
        return `<div class="row">
          <span class="dotstatus" style="background:${s.color}"></span>
          <div style="flex:1;min-width:0">
            <div class="title">${esc(c.name)}</div>
            <div class="sub">${esc(c.issuer)}</div>
          </div>
          <div style="text-align:right">
            <div class="status" style="color:${s.color}">${s.label}</div>
            <input class="datebtn" type="date" value="${c.expiry}" onchange="updateCertDate('${c.id}', this.value)">
          </div>
          <button class="iconbtn" onclick="startEdit('cert','${c.id}')">${icon('edit','var(--dim)',14)}</button>
          <button class="iconbtn" onclick="deleteCert('${c.id}')">${icon('trash','var(--red)',14)}</button>
        </div>`;
      }).join('');
  return `<div class="card">
    ${rows}
    <form class="addform" onsubmit="addCert(event)">
      <input class="fld" id="cert-name" placeholder="Nome do certificado">
      <input class="fld" id="cert-issuer" placeholder="Emissor">
      <input class="fld" id="cert-expiry" type="date" style="flex:0 0 auto">
      <button class="addbtn" type="submit">${icon('plus','var(--bg)',14)} Adicionar</button>
    </form>
  </div>`;
}

function renderTasks(){
  const order = { alta:0, media:1, baixa:2 };
  const list = [...state.data.tasks].sort((a,b)=> (a.done!==b.done) ? (a.done?1:-1) : order[a.priority]-order[b.priority]);
  const pColor = { alta:'var(--red)', media:'var(--amber)', baixa:'var(--dim)' };
  const rows = list.length === 0
    ? `<p class="empty">Nenhuma ação cadastrada.</p>`
    : list.map(t => {
        if (state.editing && state.editing.type==='task' && state.editing.id===t.id){
          return `<div class="editform">
            <div class="fldrow">
              <input class="fld" id="edit-task-text" value="${esc(t.text)}" style="flex:1;min-width:160px">
              <select class="fld" id="edit-task-priority" style="flex:0 0 auto">
                <option value="alta" ${t.priority==='alta'?'selected':''}>Alta</option>
                <option value="media" ${t.priority==='media'?'selected':''}>Média</option>
                <option value="baixa" ${t.priority==='baixa'?'selected':''}>Baixa</option>
              </select>
            </div>
            <div class="editactions">
              <button class="cancelbtn" onclick="cancelEdit()">${icon('x','var(--dim)',13)} Cancelar</button>
              <button class="savebtn" onclick="saveTaskEdit('${t.id}')">${icon('check','var(--bg)',13)} Salvar</button>
            </div>
          </div>`;
        }
        return `<div class="row">
        <button class="iconbtn" onclick="toggleTask('${t.id}')">${icon(t.done?'check':'circle', t.done?'var(--green)':'var(--dim)', 18)}</button>
        <div class="title ${t.done?'done':''}" style="flex:1">${esc(t.text)}</div>
        <span class="prio" style="color:${pColor[t.priority]}">${t.priority}</span>
        <button class="iconbtn" onclick="startEdit('task','${t.id}')">${icon('edit','var(--dim)',14)}</button>
        <button class="iconbtn" onclick="deleteTask('${t.id}')">${icon('trash','var(--red)',14)}</button>
      </div>`;
      }).join('');
  return `<div class="card">
    ${rows}
    <form class="addform" onsubmit="addTask(event)">
      <input class="fld" id="task-text" placeholder="Nova ação pendente" style="flex:1;min-width:160px">
      <select class="fld" id="task-priority" style="flex:0 0 auto">
        <option value="alta">Alta</option>
        <option value="media" selected>Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <button class="addbtn" type="submit">${icon('plus','var(--bg)',14)} Adicionar</button>
    </form>
  </div>`;
}

function renderLogs(){
  const list = [...state.data.logs].reverse();
  const rows = list.length === 0
    ? `<p class="empty">Nenhum registro ainda.</p>`
    : list.map(l => {
        if (state.editing && state.editing.type==='log' && state.editing.id===l.id){
          return `<div class="editform">
            <textarea class="fld" id="edit-log-text" style="width:100%;min-height:70px;resize:vertical;font-family:'Inter',sans-serif">${esc(l.text)}</textarea>
            <div class="editactions">
              <button class="cancelbtn" onclick="cancelEdit()">${icon('x','var(--dim)',13)} Cancelar</button>
              <button class="savebtn" onclick="saveLogEdit('${l.id}')">${icon('check','var(--bg)',13)} Salvar</button>
            </div>
          </div>`;
        }
        return `<div class="row">
        <span class="sub" style="flex-shrink:0;padding-top:2px">${fmtDateTime(l.ts)}</span>
        <div class="title" style="flex:1;white-space:normal">${esc(l.text)}</div>
        <button class="iconbtn" onclick="startEdit('log','${l.id}')">${icon('edit','var(--dim)',13)}</button>
        <button class="iconbtn" onclick="deleteLog('${l.id}')">${icon('trash','var(--red)',13)}</button>
      </div>`;
      }).join('');
  return `<div class="card">
    <form class="addform" onsubmit="addLog(event)" style="margin-bottom:4px">
      <input class="fld" id="log-text" placeholder="Registrar nota no log..." style="flex:1">
      <button class="addbtn" type="submit">${icon('plus','var(--bg)',14)}</button>
    </form>
    ${rows}
  </div>`;
}

function bindHandlers(){
  window.toggleAgendaSpeech = () => {
    if (!('speechSynthesis' in window)){
      alert('Seu navegador não suporta leitura por voz.');
      return;
    }
    if (window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      render();
      return;
    }
    const utter = new SpeechSynthesisUtterance(buildAgendaText());
    utter.lang = 'pt-BR';
    utter.rate = 0.98;
    utter.onend = () => render();
    utter.onerror = () => render();
    window.speechSynthesis.speak(utter);
    render();
  };

  window.exportData = () => {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `painel-comando-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  window.importData = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object') throw new Error('formato inválido');
        state.data = {
          certs: Array.isArray(parsed.certs) ? parsed.certs : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          logs: Array.isArray(parsed.logs) ? parsed.logs : [],
          reminders: Array.isArray(parsed.reminders) ? parsed.reminders : [],
        };
        saveData();
        state.editing = null;
        render();
      }catch(e){
        alert('Não foi possível importar esse arquivo. Verifique se é um backup válido do Painel de Comando.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  };

  window.startEdit = (type, id) => { state.editing = { type, id }; render(); };
  window.cancelEdit = () => { state.editing = null; render(); };

  window.saveReminderEdit = (id) => {
    const r = state.data.reminders.find(r=>r.id===id);
    const title = document.getElementById('edit-rem-title').value.trim();
    const when = document.getElementById('edit-rem-when').value;
    if (r && title && when){ r.title = title; r.when = when; }
    state.editing = null; saveData(); render();
  };
  window.saveCertEdit = (id) => {
    const c = state.data.certs.find(c=>c.id===id);
    const name = document.getElementById('edit-cert-name').value.trim();
    const issuer = document.getElementById('edit-cert-issuer').value.trim();
    if (c && name){ c.name = name; c.issuer = issuer; }
    state.editing = null; saveData(); render();
  };
  window.saveTaskEdit = (id) => {
    const t = state.data.tasks.find(t=>t.id===id);
    const text = document.getElementById('edit-task-text').value.trim();
    const priority = document.getElementById('edit-task-priority').value;
    if (t && text){ t.text = text; t.priority = priority; }
    state.editing = null; saveData(); render();
  };
  window.saveLogEdit = (id) => {
    const l = state.data.logs.find(l=>l.id===id);
    const text = document.getElementById('edit-log-text').value.trim();
    if (l && text){ l.text = text; }
    state.editing = null; saveData(); render();
  };

  window.addReminder = (e) => {
    e.preventDefault();
    const title = document.getElementById('rem-title').value.trim();
    const when = document.getElementById('rem-when').value;
    if (!title || !when) return;
    state.data.reminders.push({ id: uid(), title, when });
    saveData(); render();
  };
  window.deleteReminder = (id) => { state.data.reminders = state.data.reminders.filter(r=>r.id!==id); saveData(); render(); };

  window.addCert = (e) => {
    e.preventDefault();
    const name = document.getElementById('cert-name').value.trim();
    const issuer = document.getElementById('cert-issuer').value.trim();
    const expiry = document.getElementById('cert-expiry').value;
    if (!name || !expiry) return;
    state.data.certs.push({ id: uid(), name, issuer, expiry });
    saveData(); render();
  };
  window.updateCertDate = (id, value) => {
    const c = state.data.certs.find(c=>c.id===id); if (c){ c.expiry = value; saveData(); render(); }
  };
  window.deleteCert = (id) => { state.data.certs = state.data.certs.filter(c=>c.id!==id); saveData(); render(); };

  window.addTask = (e) => {
    e.preventDefault();
    const text = document.getElementById('task-text').value.trim();
    const priority = document.getElementById('task-priority').value;
    if (!text) return;
    state.data.tasks.push({ id: uid(), text, done:false, priority });
    saveData(); render();
  };
  window.toggleTask = (id) => { const t = state.data.tasks.find(t=>t.id===id); if(t){ t.done = !t.done; saveData(); render(); } };
  window.deleteTask = (id) => { state.data.tasks = state.data.tasks.filter(t=>t.id!==id); saveData(); render(); };

  window.addLog = (e) => {
    e.preventDefault();
    const text = document.getElementById('log-text').value.trim();
    if (!text) return;
    state.data.logs.push({ id: uid(), text, ts: new Date().toISOString() });
    saveData(); render();
  };
  window.deleteLog = (id) => { state.data.logs = state.data.logs.filter(l=>l.id!==id); saveData(); render(); };
}

function enterApp(){
  const splash = document.getElementById('splash');
  splash.classList.add('hide');
  setTimeout(() => { splash.style.display = 'none'; }, 350);
}
window.enterApp = enterApp;

(async function init(){
  const splash = document.getElementById('splash');
  splash.style.display = 'none';
})();
</script>
</body>
</html>
